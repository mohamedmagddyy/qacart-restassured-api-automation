# Default environment used when -Denv is not provided.
env=test

# TODO: Replace placeholder URLs with the real API base URLs when available.
base.url.local=
base.url.test=https://todo.qacart.com
base.url.staging=

# Enables REST Assured to call the QA Cart test API from local machines where Java trust stores
# do not trust the presented certificate chain.
ssl.relaxed=true

# TODO: Replace placeholder route paths with the real API paths when available.
route.register=/api/v1/users/register
route.login=/api/v1/users/login
route.todos=/api/v1/tasks
